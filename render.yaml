# Render Blueprint — interviewX backend (one-click deploy)
#
# Add this file to the repo root, then in Render: New → Blueprint → connect
# the repo skit-devops-2026/devops-24ESKCS086. Render builds the service
# from the root Dockerfile (backend) and starts it on the platform PORT.
services:
  - type: web
    name: interviewx-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
